name: Deploy to Production

on:
  pull_request:
    branches:
      - production
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: write

concurrency:
  group: deploy-to-prod-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-auth:
    name: Verify lint + prettier (auth)
    if: github.head_ref == 'develop'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Prettier
        run: npx prettier --check .

  deploy-to-production:
    name: Merge develop -> production (auth)
    if: github.head_ref == 'develop' && needs.verify-auth.result == 'success'
    runs-on: ubuntu-latest
    needs: verify-auth

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge develop into production
        run: |
          git fetch origin
          git checkout production
          git merge --no-ff origin/develop -m "chore: merge develop -> production [auto]"
          git remote set-url origin https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/${{ github.repository }}
          git push origin production

